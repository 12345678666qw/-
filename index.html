<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secret</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .header {
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: #999;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .header .subtitle span {
            background: #1e1e1e;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #ccc;
            border: 1px solid #333;
        }

        .section {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #ccc;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            background: #1a1a1a;
            color: #e0e0e0;
            transition: all 0.2s ease;
            outline: none;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #ffffff;
            background: #222;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        textarea {
            min-height: 90px;
        }

        .button-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }

        button {
            padding: 0.85rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 14px;
            border: 1px solid #ffffff;
            background: #ffffff;
            color: #000;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        button.outline {
            background: transparent;
            color: #ffffff;
            border: 1px solid #444;
        }

        button.outline:hover {
            background: #1e1e1e;
            border-color: #ffffff;
        }

        button:hover {
            background: #e0e0e0;
            border-color: #e0e0e0;
        }

        button.outline:hover {
            background: #1e1e1e;
        }

        .format-toggle {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .format-btn {
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            border-radius: 10px;
            border: 1px solid #333;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .format-btn.active {
            background: #ffffff;
            color: #000;
            border-color: #ffffff;
        }

        .result-area {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            min-height: 70px;
            word-break: break-all;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #d0d0d0;
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .result-area.empty {
            color: #666;
            font-family: inherit;
            font-style: italic;
        }

        .inline-label {
            font-weight: 500;
            margin-right: 0.5rem;
            color: #999;
            font-style: normal;
            font-family: inherit;
        }

        .divider {
            border-top: 1px solid #222;
            margin: 1.8rem 0 1.2rem 0;
        }

        .footer-note {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-top: 1.5rem;
            letter-spacing: 0.2px;
        }

        /* 黑色弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-dialog {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 2rem 2rem 1.5rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            color: #e0e0e0;
            animation: slideUp 0.25s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 500;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: 1px solid #444;
            color: #ccc;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .modal-close:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .modal-body {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 1.2rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 1rem;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            color: #d0d0d0;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
        }

        .modal-footer button {
            padding: 0.6rem 1.5rem;
            font-size: 0.85rem;
            border-radius: 12px;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.8rem 1.2rem;
            }
            .button-group {
                flex-direction: column;
            }
            .format-toggle {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RC4</h1>
            <div class="subtitle">
                对称加密 · 流密码 <span></span>
            </div>
        </div>

        <div class="section">
            <label>🔑 密钥</label>
            <input type="text" id="keyInput" placeholder="输入任意字符串密钥…" value="myselfSecret">
        </div>

        <div class="section">
            <label>📝 明文 / 密文内容</label>
            <textarea id="dataInput" placeholder="输入文本（支持汉字、Emoji…）">偷偷藏起来，哈哈哈</textarea>
        </div>

        <div class="button-group">
            <button id="encryptBtn"> 秘密枷锁</button>
            <button id="decryptBtn" class="outline"> 钥匙</button>
        </div>

        <div class="divider"></div>

        <div class="section">
            <label> secret</label>
            <div id="outputBox" class="result-area empty">
                <span class="inline-label">等待操作…</span>
            </div>
            <div class="format-toggle" id="formatToggle">
                <button class="format-btn" data-format="bin">2 进制</button>
                <button class="format-btn" data-format="oct">8 进制</button>
                <button class="format-btn active" data-format="hex">16 进制</button>
                <button class="format-btn" data-format="b64">Base64</button>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 0.8rem;">
                <button id="copyBtn" class="outline" style="padding:0.5rem 1.2rem; font-size:0.8rem; border-radius:10px;">偷偷拿走</button>
            </div>
        </div>
        <div class="footer-note">
        </div>
    </div>

    <script>
        (function() {
          
            function rc4(keyBytes, dataBytes) {
                const S = new Array(256);
                for (let i = 0; i < 256; i++) S[i] = i;
                let j = 0;
                const keyLen = keyBytes.length;
                for (let i = 0; i < 256; i++) {
                    j = (j + S[i] + keyBytes[i % keyLen]) & 0xFF;
                    [S[i], S[j]] = [S[j], S[i]];
                }

                let i = 0;
                j = 0;
                const result = new Uint8Array(dataBytes.length);
                for (let idx = 0; idx < dataBytes.length; idx++) {
                    i = (i + 1) & 0xFF;
                    j = (j + S[i]) & 0xFF;
                    [S[i], S[j]] = [S[j], S[i]];
                    const K = S[(S[i] + S[j]) & 0xFF];
                    result[idx] = dataBytes[idx] ^ K;
                }
                return result;
            }

            function toUTF8Bytes(str) {
                return new TextEncoder().encode(str);
            }

            function bytesToHex(bytes) {
                return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
            }

            function bytesToBinary(bytes) {
                return Array.from(bytes).map(b => b.toString(2).padStart(8, '0')).join(' ');
            }

            function bytesToOctal(bytes) {
                return Array.from(bytes).map(b => b.toString(8).padStart(3, '0')).join(' ');
            }

            function bytesToBase64(bytes) {
                const binaryStr = Array.from(bytes).map(b => String.fromCharCode(b)).join('');
                return btoa(binaryStr);
            }

            function hexToBytes(hex) {
                const cleanHex = hex.replace(/\s/g, '');
                if (cleanHex.length % 2 !== 0) throw new Error('无效的十六进制字符串');
                const bytes = new Uint8Array(cleanHex.length / 2);
                for (let i = 0; i < bytes.length; i++) {
                    bytes[i] = parseInt(cleanHex.substr(i * 2, 2), 16);
                }
                return bytes;
            }

            function bytesToUTF8(bytes) {
                const decoder = new TextDecoder('utf-8', { fatal: false });
                return decoder.decode(bytes);
            }

            
            const keyInput = document.getElementById('keyInput');
            const dataInput = document.getElementById('dataInput');
            const encryptBtn = document.getElementById('encryptBtn');
            const decryptBtn = document.getElementById('decryptBtn');
            const outputBox = document.getElementById('outputBox');
            const copyBtn = document.getElementById('copyBtn');
            const formatToggle = document.getElementById('formatToggle');
            const formatBtns = formatToggle.querySelectorAll('.format-btn');

            let currentCipherBytes = null;  // 存储密文字节数组
            let currentFormat = 'hex';      // 当前显示格式

            function setOutput(text, type = 'normal') {
                outputBox.classList.remove('empty');
                if (type === 'error') {
                    outputBox.innerHTML = `<span style="color:#ff6b6b;">⚠️ ${escapeHTML(text)}</span>`;
                } else {
                    outputBox.innerHTML = `<span class="inline-label">${getFormatLabel()}</span> ${escapeHTML(text)}`;
                }
            }

            function setEmptyOutput() {
                outputBox.classList.add('empty');
                outputBox.innerHTML = '<span class="inline-label">等待操作…</span>';
                currentCipherBytes = null;
            }

            function getFormatLabel() {
                const labels = { bin: '二进制:', oct: '八进制:', hex: '十六进制:', b64: 'Base64:' };
                return labels[currentFormat] || '';
            }

            function escapeHTML(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            
            function renderCipher() {
                if (!currentCipherBytes) {
                    setEmptyOutput();
                    return;
                }
                let text;
                switch (currentFormat) {
                    case 'bin': text = bytesToBinary(currentCipherBytes); break;
                    case 'oct': text = bytesToOctal(currentCipherBytes); break;
                    case 'hex': text = bytesToHex(currentCipherBytes); break;
                    case 'b64': text = bytesToBase64(currentCipherBytes); break;
                    default: text = bytesToHex(currentCipherBytes);
                }
                setOutput(text);
            }

            
            formatBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    formatBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFormat = btn.dataset.format;
                    renderCipher();
                });
            });

            // 加密
            encryptBtn.addEventListener('click', () => {
                try {
                    const keyStr = keyInput.value;
                    const plaintext = dataInput.value;
                    if (!keyStr) { setOutput('请输入密钥', 'error'); return; }
                    if (!plaintext) { setOutput('请输入明文内容', 'error'); return; }

                    const keyBytes = toUTF8Bytes(keyStr);
                    const plainBytes = toUTF8Bytes(plaintext);
                    currentCipherBytes = rc4(keyBytes, plainBytes);
                    renderCipher();
                } catch (e) {
                    setOutput('加密失败: ' + e.message, 'error');
                    currentCipherBytes = null;
                }
            });

            // 黑色弹窗
            function showModal(title, content) {
               
                const existing = document.querySelector('.modal-overlay');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal-dialog">
                        <div class="modal-header">
                            <h3>${escapeHTML(title)}</h3>
                            <button class="modal-close">✕</button>
                        </div>
                        <div class="modal-body">${escapeHTML(content)}</div>
                        <div class="modal-footer">
                            <button class="modal-close-btn">关闭</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                const closeModal = () => overlay.remove();
                overlay.querySelector('.modal-close').addEventListener('click', closeModal);
                overlay.querySelector('.modal-close-btn').addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModal();
                });
            }

            // 解密
            decryptBtn.addEventListener('click', () => {
                try {
                    const keyStr = keyInput.value;
                    const inputText = dataInput.value.trim();
                    if (!keyStr) { setOutput('请输入密钥', 'error'); return; }
                    if (!inputText) { setOutput('请输入密文（十六进制）', 'error'); return; }

                    
                    const hexRegex = /^[0-9a-fA-F\s]+$/;
                    if (!hexRegex.test(inputText)) {
                        setOutput('用十六进制字符串吧（例如：75 ca 3f c1 a5 48）', 'error');
                        return;
                    }

                    const cipherBytes = hexToBytes(inputText);
                    const keyBytes = toUTF8Bytes(keyStr);
                    const decryptedBytes = rc4(keyBytes, cipherBytes);
                    const decryptedText = bytesToUTF8(decryptedBytes);

                    // 弹窗显示解密结果
                    showModal('secret', decryptedText);
                    
                } catch (e) {
                    setOutput('这个secret不能知道哦' + e.message, 'error');
                }
            });

            // 复制当秘密
            copyBtn.addEventListener('click', () => {
                const textToCopy = outputBox.textContent || '';
                if (!textToCopy || outputBox.classList.contains('empty')) {
                    alert('没有偷的的结果哦');
                    return;
                }
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '已拿走';
                    copyBtn.style.borderColor = '#ffffff';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                        copyBtn.style.borderColor = '#444';
                    }, 1500);
                }).catch(() => alert('拿走失败，这个秘密你把握不住'));
            });

            // Ctrl+Enter 
            dataInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    encryptBtn.click();
                }
            });

            
            setEmptyOutput();
        })();
    </script>
</body>
</html>
